<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#cfeeff" />
  <title>大陸の生態系</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">LIVING ECOSYSTEM</p>
        <h1>大陸の生態系</h1>
      </div>
      <div class="top-buttons">
        <button id="speedBtn" class="pill ghost" type="button">速度 ×1</button>
        <button id="pauseBtn" class="pill" type="button">一時停止</button>
        <button id="resetBtn" class="pill ghost" type="button">リセット</button>
      </div>
    </header>

    <section class="layout">
      <section class="world-card">
        <div class="section-head">
          <div>
            <p class="eyebrow">CONTINENT</p>
            <h2>生き物を見守る</h2>
          </div>
          <div class="badges">
            <span class="badge">経過 <b id="yearLabel">0.0</b>年</span>
            <span class="badge">安定度 <b id="stabilityLabel">--</b></span>
          </div>
        </div>
        <canvas id="world" width="960" height="640" aria-label="大陸の生態系"></canvas>
        <div id="ticker" class="ticker">生き物をタップすると年齢や空腹度を見られます。</div>
        <div id="selectedCard" class="selected-card hidden"></div>
      </section>

      <aside class="side-panel">
        <section class="panel">
          <div class="section-head compact"><h2>個体数</h2></div>
          <div id="stats" class="stats"></div>
        </section>

        <section class="panel">
          <div class="section-head compact"><h2>大陸へ追加</h2></div>
          <p class="note">増やせば良いとは限りません。崩れたときの救済にも使えます。</p>
          <div id="controls" class="controls"></div>
        </section>

        <section class="panel rule-panel">
          <div class="section-head compact"><h2>この世界のルール</h2></div>
          <div class="food-chain">
            <div>🐺 狼 → 🦊 狐・🦌 鹿・🐇 うさぎ</div>
            <div>🦊 狐 → 🐇 うさぎ・🦌 鹿</div>
            <div>🦌 鹿 → 🌿 草・🌱 木の芽</div>
            <div>🐇 うさぎ → 🌿 草</div>
          </div>
          <p class="note">十分に食べた成獣どうしが触れると繁殖。寿命で死ぬと、その場所が豊かな土になり草木が増えます。</p>
        </section>

        <section class="panel">
          <div class="section-head compact"><h2>できごと</h2></div>
          <div id="log" class="log"></div>
        </section>
      </aside>
    </section>
  </main>
  <script src="app.js"></script>
  <script src="stage.js"></script>
  <script src="intervention.js"></script>
  <script src="education.js"></script>
  <script src="compact-ui.js"></script>
</body>
</html>
