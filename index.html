<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6ea97a">
  <title>つながる！大陸の生態系</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div><p class="kicker" id="stageLabel">STAGE 1 / 4</p><h1>つながる！大陸の生態系</h1></div>
      <button class="small-button" id="resetButton" type="button">↻ やり直す</button>
    </header>

    <nav class="stage-tabs" id="stageTabs" aria-label="ステージ選択"></nav>

    <section class="chain-card" aria-label="現在の食物連鎖">
      <div class="chain-title"><span>いまの食物連鎖</span><strong id="streakText">安定まで あと2年</strong></div>
      <div class="food-chain" id="foodChain"></div>
      <p class="chain-message" id="chainMessage">矢印をつなげよう！</p>
    </section>

    <section class="game-grid">
      <section class="world-card">
        <div class="world-head"><div><p class="kicker" id="lessonLabel"></p><h2 id="stageTitle"></h2></div><span class="year-badge" id="yearLabel">1年目 / 6年</span></div>
        <div class="canvas-wrap"><canvas id="world" width="900" height="520" aria-label="2つの茶色い大陸と生き物"></canvas><div class="anim-label hidden" id="animLabel"></div></div>
        <p class="hint" id="hint"></p>
      </section>

      <aside class="play-panel">
        <section><h2>① いまの数を見る</h2><div class="species-cards" id="speciesCards"></div></section>
        <section><h2>② 1回だけ行動する</h2><div class="action-tabs" id="actionTabs"></div><div id="actionOptions" class="action-options"></div><p class="selection" id="selectionText">「何もしない」を選択中</p></section>
        <button class="next-year" id="nextYearButton" type="button">1年進める <span>▶</span></button>
      </aside>
    </section>
  </main>

  <div class="overlay hidden" id="resultOverlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <section class="result-card">
      <div class="result-icon" id="resultIcon">🌱</div><p class="kicker">ことしの結果</p><h2 id="resultTitle">生態系が変化したよ</h2>
      <div class="result-lines" id="resultLines"></div>
      <button class="result-button" id="resultButton" type="button">次の判断へ</button>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
